<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640">
  <style>
    :root {
      --bg: #f8fafc;
      --bg-grid: #e2e8f0;
      --mask: #f8fafc;
      --text: #0f172a;
      --text-muted: #475569;
      --arrow: #64748b;
      --color-primary-fill: rgba(6,182,212,0.12);
      --color-primary-stroke: #0891b2;
      --color-secondary-fill: rgba(5,150,105,0.12);
      --color-secondary-stroke: #059669;
      --color-accent-fill: rgba(217,119,6,0.12);
      --color-accent-stroke: #d97706;
      --color-alert-fill: rgba(225,29,72,0.12);
      --color-alert-stroke: #e11d48;
      --color-neutral-fill: rgba(100,116,139,0.12);
      --color-neutral-stroke: #64748b;
    }
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'Noto Sans Mono', 'DejaVu Sans Mono', monospace; }
    .title { font-size: 20px; font-weight: 700; fill: var(--text); }
    .sub { font-size: 12px; fill: var(--text-muted); }
    .name { font-size: 14px; font-weight: 600; fill: var(--text); }
    .desc { font-size: 12px; fill: var(--text-muted); }
    .label { font-size: 12px; fill: var(--text-muted); }
    .mono { font-size: 12px; fill: var(--text); }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--bg-grid)" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="var(--bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- watchdog note region -->
  <rect x="480" y="480" width="380" height="126" rx="12" fill="none" stroke="var(--color-neutral-stroke)" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="496" y="504" font-size="12" font-weight="600" fill="var(--color-neutral-stroke)">What the watchdog reports</text>
  <text x="496" y="528" class="mono" xml:space="preserve">running over 2 h  →  STALLED</text>
  <text x="496" y="548" class="mono" xml:space="preserve">needs-you         →  NEEDS-YOU</text>
  <text x="496" y="568" class="mono" xml:space="preserve">failed            →  FAILED</text>
  <text x="496" y="588" class="mono" xml:space="preserve">done, but too old →  OVERDUE</text>

  <!-- arrows -->
  <line x1="205" y1="104" x2="205" y2="138" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="217" y="126" class="label">/routine run &lt;name&gt;</text>

  <line x1="330" y1="180" x2="558" y2="180" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="444" y="170" class="label" text-anchor="middle">every step succeeded</text>

  <line x1="330" y1="210" x2="558" y2="350" stroke="var(--color-alert-stroke)" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="470" y="262" class="label">a step failed or</text>
  <text x="470" y="278" class="label">a tool is missing</text>

  <line x1="150" y1="220" x2="150" y2="338" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="140" y="272" class="label" text-anchor="end">ask-before</text>
  <text x="140" y="288" class="label" text-anchor="end">item reached</text>

  <line x1="260" y1="340" x2="260" y2="222" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="270" y="272" class="label">you answered</text>
  <text x="270" y="288" class="label">(one yes per item)</text>

  <line x1="205" y1="420" x2="205" y2="498" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="215" y="464" class="label">no answer: the run stops</text>

  <path d="M 80,540 L 34,540 L 34,180 L 78,180" fill="none" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

  <line x1="810" y1="180" x2="846" y2="180" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="810" y1="380" x2="846" y2="380" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- start + final markers -->
  <circle cx="205" cy="96" r="8" fill="var(--text)"/>
  <circle cx="858" cy="180" r="10" fill="none" stroke="var(--text)" stroke-width="1.5"/>
  <circle cx="858" cy="180" r="5" fill="var(--text)"/>
  <circle cx="858" cy="380" r="10" fill="none" stroke="var(--text)" stroke-width="1.5"/>
  <circle cx="858" cy="380" r="5" fill="var(--text)"/>

  <!-- masks -->
  <rect x="80" y="140" width="250" height="80" rx="16" fill="var(--mask)"/>
  <rect x="560" y="140" width="250" height="80" rx="16" fill="var(--mask)"/>
  <rect x="80" y="340" width="250" height="80" rx="16" fill="var(--mask)"/>
  <rect x="560" y="340" width="250" height="80" rx="16" fill="var(--mask)"/>
  <rect x="80" y="500" width="250" height="80" rx="16" fill="var(--mask)"/>

  <!-- states -->
  <rect x="80" y="140" width="250" height="80" rx="16" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="1.5"/>
  <text x="205" y="170" class="name" text-anchor="middle">running</text>
  <text x="205" y="194" class="desc" text-anchor="middle">record written before work</text>

  <rect x="560" y="140" width="250" height="80" rx="16" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="1.5"/>
  <text x="685" y="170" class="name" text-anchor="middle">done</text>
  <text x="685" y="194" class="desc" text-anchor="middle">one-line summary written</text>

  <rect x="80" y="340" width="250" height="80" rx="16" fill="var(--color-accent-fill)" stroke="var(--color-accent-stroke)" stroke-width="1.5"/>
  <text x="205" y="370" class="name" text-anchor="middle">needs-you</text>
  <text x="205" y="394" class="desc" text-anchor="middle">question + prepared work</text>

  <rect x="560" y="340" width="250" height="80" rx="16" fill="var(--color-alert-fill)" stroke="var(--color-alert-stroke)" stroke-width="1.5"/>
  <text x="685" y="370" class="name" text-anchor="middle">failed</text>
  <text x="685" y="394" class="desc" text-anchor="middle">what broke, how far it got</text>

  <rect x="80" y="500" width="250" height="80" rx="16" fill="var(--color-neutral-fill)" stroke="var(--color-neutral-stroke)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="205" y="530" class="name" text-anchor="middle">next scheduled run</text>
  <text x="205" y="554" class="desc" text-anchor="middle">asks the open question first</text>

  <text x="30" y="42" class="title">One run, start to finish</text>
  <text x="30" y="66" class="sub">Each run writes its record first and ends as done, needs-you or failed. A notification goes out only for the last two.</text>
</svg>
