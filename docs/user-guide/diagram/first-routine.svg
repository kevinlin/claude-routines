<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 870">
  <style>
    :root {
      --bg: #f8fafc;
      --bg-grid: #e2e8f0;
      --mask: #f8fafc;
      --text: #0f172a;
      --text-muted: #475569;
      --arrow: #64748b;
      --color-primary-fill: rgba(6,182,212,0.12);
      --color-primary-stroke: #0891b2;
      --color-secondary-fill: rgba(5,150,105,0.12);
      --color-secondary-stroke: #059669;
      --color-tertiary-fill: rgba(124,58,237,0.12);
      --color-tertiary-stroke: #7c3aed;
      --color-accent-fill: rgba(217,119,6,0.12);
      --color-accent-stroke: #d97706;
      --color-neutral-fill: rgba(100,116,139,0.12);
      --color-neutral-stroke: #64748b;
      --color-highlight-fill: rgba(59,130,246,0.12);
      --color-highlight-stroke: #3b82f6;
    }
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'Noto Sans Mono', 'DejaVu Sans Mono', monospace; }
    .title { font-size: 20px; font-weight: 700; fill: var(--text); }
    .sub { font-size: 12px; fill: var(--text-muted); }
    .name { font-size: 14px; font-weight: 600; fill: var(--text); }
    .desc { font-size: 12px; fill: var(--text-muted); }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--bg-grid)" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow)"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="var(--bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- arrows -->
  <line x1="220" y1="180" x2="220" y2="224" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="180" x2="600" y2="224" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 220,290 L 220,312 L 410,312" fill="none" stroke="var(--arrow)" stroke-width="1.5"/>
  <path d="M 600,290 L 600,312 L 410,312" fill="none" stroke="var(--arrow)" stroke-width="1.5"/>
  <line x1="410" y1="312" x2="410" y2="334" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="400" x2="410" y2="444" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="510" x2="410" y2="554" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="620" x2="410" y2="664" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="730" x2="410" y2="774" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- masks -->
  <rect x="60" y="100" width="320" height="80" rx="6" fill="var(--mask)"/>
  <rect x="440" y="100" width="320" height="80" rx="6" fill="var(--mask)"/>
  <rect x="60" y="226" width="320" height="64" rx="6" fill="var(--mask)"/>
  <rect x="440" y="226" width="320" height="64" rx="6" fill="var(--mask)"/>
  <rect x="170" y="336" width="480" height="64" rx="6" fill="var(--mask)"/>
  <rect x="170" y="446" width="480" height="64" rx="6" fill="var(--mask)"/>
  <rect x="170" y="556" width="480" height="64" rx="6" fill="var(--mask)"/>
  <rect x="170" y="666" width="480" height="64" rx="6" fill="var(--mask)"/>
  <rect x="170" y="776" width="480" height="64" rx="32" fill="var(--mask)"/>

  <!-- row 1: two ways in -->
  <rect x="60" y="100" width="320" height="80" rx="6" fill="var(--color-highlight-fill)" stroke="var(--color-highlight-stroke)" stroke-width="1.5"/>
  <text x="220" y="126" class="name" text-anchor="middle">Do the job once by hand</text>
  <text x="220" y="148" class="desc" text-anchor="middle">in a normal Claude session</text>
  <text x="220" y="168" font-size="12" font-weight="600" fill="var(--color-highlight-stroke)" text-anchor="middle">recommended</text>

  <rect x="440" y="100" width="320" height="80" rx="6" fill="var(--color-neutral-fill)" stroke="var(--color-neutral-stroke)" stroke-width="1.5"/>
  <text x="600" y="126" class="name" text-anchor="middle">Describe the job</text>
  <text x="600" y="148" class="desc" text-anchor="middle">what, when, what it may change,</text>
  <text x="600" y="168" class="desc" text-anchor="middle">where it must ask first</text>

  <!-- row 2: commands -->
  <rect x="60" y="226" width="320" height="64" rx="6" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="1.5"/>
  <text x="220" y="252" class="name" text-anchor="middle">/routine save &lt;name&gt;</text>
  <text x="220" y="274" class="desc" text-anchor="middle">keeps steps, decisions, corrections</text>

  <rect x="440" y="226" width="320" height="64" rx="6" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="1.5"/>
  <text x="600" y="252" class="name" text-anchor="middle">/routine new &lt;name&gt;</text>
  <text x="600" y="274" class="desc" text-anchor="middle">a short interview</text>

  <!-- rows 3-7 -->
  <rect x="170" y="336" width="480" height="64" rx="6" fill="var(--color-tertiary-fill)" stroke="var(--color-tertiary-stroke)" stroke-width="1.5"/>
  <text x="410" y="362" class="name" text-anchor="middle">Draft in ~/.routines/&lt;name&gt;/</text>
  <text x="410" y="384" class="desc" text-anchor="middle">paused: true, with questions to settle on the first run</text>

  <rect x="170" y="446" width="480" height="64" rx="6" fill="var(--color-accent-fill)" stroke="var(--color-accent-stroke)" stroke-width="1.5"/>
  <text x="410" y="472" class="name" text-anchor="middle">Create a local task in Claude Desktop</text>
  <text x="410" y="494" class="desc" text-anchor="middle">prompt /routine run &lt;name&gt;, its folder, a schedule</text>

  <rect x="170" y="556" width="480" height="64" rx="6" fill="var(--color-primary-fill)" stroke="var(--color-primary-stroke)" stroke-width="1.5"/>
  <text x="410" y="582" class="name" text-anchor="middle">Press Run now and watch it</text>
  <text x="410" y="604" class="desc" text-anchor="middle">answer its questions; always allow read-only tools</text>

  <rect x="170" y="666" width="480" height="64" rx="6" fill="var(--color-secondary-fill)" stroke="var(--color-secondary-stroke)" stroke-width="1.5"/>
  <text x="410" y="692" class="name" text-anchor="middle">Remove paused: true</text>
  <text x="410" y="714" class="desc" text-anchor="middle">in ROUTINE.md; later runs can go unattended</text>

  <rect x="170" y="776" width="480" height="64" rx="32" fill="var(--color-highlight-fill)" stroke="var(--color-highlight-stroke)" stroke-width="1.5"/>
  <text x="410" y="802" class="name" text-anchor="middle">Runs on schedule</text>
  <text x="410" y="824" class="desc" text-anchor="middle">/routine status and the watchdog keep watch</text>

  <text x="30" y="42" class="title">From a job you repeat to a scheduled routine</text>
  <text x="30" y="66" class="sub">A routine written from a real run is usually better than one written from a description.</text>
</svg>
